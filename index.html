<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUN VIETNAM | 썬베트남</title>
<meta name="description" content="SUN VIETNAM – đại lý SUNMEDI tại Việt Nam: vật tư đào tạo y tế – an toàn và vật tư PCCC.">
<meta name="theme-color" content="#DD2326">
<link rel="icon" href="assets/img/logo@2x.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/logo@2x.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="hero">
  <div class="wrap hero__in">
    <div class="hero__copy">
      <p class="eyebrow" data-i18n="hero.eyebrow"></p>
      <h1 class="hero__title" data-i18n-html="hero.title"></h1>
      <p class="hero__lead" data-i18n="hero.lead"></p>
      <div class="hero__cta">
        <a class="btn btn--primary btn--lg" href="shop.html"><span data-i18n="hero.cta"></span></a>
        <button class="btn btn--ghost btn--lg" data-join><span data-i18n="hero.cta2"></span></button>
      </div>
      <ul class="hero__badges">
        <li data-i18n="hero.badge1"></li><li data-i18n="hero.badge2"></li><li data-i18n="hero.badge3"></li>
      </ul>
    </div>
    <div class="hero__art" aria-hidden="true">
      <div class="sun"></div>
      <div class="ray ray--1"></div><div class="ray ray--2"></div><div class="ray ray--3"></div>
      <div class="hill hill--1"></div><div class="hill hill--2"></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <h2 class="h2" data-i18n="cat.title"></h2>
    <div class="cats" data-cats></div>
  </div>
</section>

<section class="section section--tint">
  <div class="wrap">
    <div class="sechead">
      <h2 class="h2" data-i18n="best.title"></h2>
      <a class="morelink" href="shop.html"><span data-i18n="best.more"></span> →</a>
    </div>
    <p class="notice" data-sample-notice hidden data-i18n="sample.notice"></p>
    <div class="grid" data-grid><p class="muted" data-i18n="shop.loading"></p></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <h2 class="h2 center" data-i18n="why.title"></h2>
    <div class="why">
      <div class="why__item"><span class="why__ic" data-ic="check"></span><h3 data-i18n="why.1.t"></h3><p data-i18n="why.1.d"></p></div>
      <div class="why__item"><span class="why__ic" data-ic="truck"></span><h3 data-i18n="why.2.t"></h3><p data-i18n="why.2.d"></p></div>
      <div class="why__item"><span class="why__ic" data-ic="chat"></span><h3 data-i18n="why.3.t"></h3><p data-i18n="why.3.d"></p></div>
      <div class="why__item"><span class="why__ic" data-ic="star"></span><h3 data-i18n="why.4.t"></h3><p data-i18n="why.4.d"></p></div>
    </div>
  </div>
</section>

<section class="join">
  <div class="wrap join__in">
    <div>
      <h2 class="join__title" data-i18n="join.title"></h2>
      <p class="join__lead" data-i18n="join.lead"></p>
    </div>
    <button class="btn btn--light btn--lg" data-join><span data-join-label data-i18n="join.cta"></span></button>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
