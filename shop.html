<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sản phẩm | SUN VIETNAM</title>
<meta name="description" content="SUN VIETNAM – đại lý SUNMEDI tại Việt Nam: vật tư đào tạo y tế – an toàn và vật tư PCCC.">
<meta name="theme-color" content="#DD2326">
<link rel="icon" href="assets/img/logo@2x.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/logo@2x.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="pagehead">
  <div class="wrap">
    <h1 class="h1" data-i18n="shop.title"></h1>
  </div>
</section>
<section class="section section--tight">
  <div class="wrap">
    <div class="toolbar">
      <div class="chips" data-filter role="tablist"></div>
      <div class="toolbar__right">
        <input class="input" type="search" data-search data-i18n-ph="shop.search">
        <select class="input" data-sort>
          <option value="default" data-i18n="shop.sort.default"></option>
          <option value="low" data-i18n="shop.sort.low"></option>
          <option value="high" data-i18n="shop.sort.high"></option>
        </select>
      </div>
    </div>
    <p class="notice" data-sample-notice hidden data-i18n="sample.notice"></p>
    <p class="muted small" data-count></p>
    <div class="grid" data-grid><p class="muted" data-i18n="shop.loading"></p></div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/pages/shop.js"></script>
</body>
</html>
