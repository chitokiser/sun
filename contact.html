<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liên hệ | SUN VIETNAM</title>
<meta name="description" content="SUN VIETNAM – sản phẩm sức khoẻ & làm đẹp Hàn Quốc chính hãng. Đối tác chính thức BestClub.">
<meta name="theme-color" content="#E8590C">
<link rel="icon" href="assets/img/logo@2x.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/logo@2x.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="pagehead">
  <div class="wrap">
    <h1 class="h1" data-i18n="contact.title"></h1>
    <p class="lead" data-i18n="contact.lead"></p>
  </div>
</section>
<section class="section section--tight">
  <div class="wrap contact">
    <form class="card form" data-form novalidate>
      <label class="field"><span data-i18n="contact.name"></span><input class="input" name="name" required autocomplete="name"></label>
      <label class="field"><span data-i18n="contact.phone"></span><input class="input" name="phone" type="tel" autocomplete="tel"></label>
      <label class="field"><span data-i18n="contact.subject"></span>
        <select class="input" name="subject">
          <option data-i18n="contact.s.product"></option><option data-i18n="contact.s.order"></option>
          <option data-i18n="contact.s.partner"></option><option data-i18n="contact.s.etc"></option>
        </select></label>
      <label class="field"><span data-i18n="contact.message"></span><textarea class="input" name="message" rows="6" required></textarea></label>
      <button class="btn btn--primary btn--block" type="submit" data-i18n="contact.send"></button>
      <p class="muted small" data-form-note hidden data-i18n="contact.noEmail"></p>
    </form>
    <aside class="card ways">
      <h2 class="h3" data-i18n="contact.ways"></h2>
      <ul class="ways__list" data-ways></ul>
      <h3 class="h4" data-i18n="contact.hours"></h3>
      <p data-hours></p>
    </aside>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/pages/contact.js"></script>
</body>
</html>
